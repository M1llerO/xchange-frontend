<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-logo">
      <a routerLink="/listings">
        <img src="logo.png" alt="XChange" class="logo-img" />
      </a>
    </div>

    <ul class="nav-menu" [class.active]="menuOpen()">
      <!-- Public Links -->
      <li class="nav-item">
        <a routerLink="/listings" routerLinkActive="active">
          Annunci
        </a>
      </li>

      <!-- User Links (requires login) -->
      <li *ngIf="authService.isLoggedIn()" class="nav-item">
        <a routerLink="/dashboard" routerLinkActive="active">
          Dashboard
        </a>
      </li>

      <li *ngIf="authService.isLoggedIn()" class="nav-item">
        <a routerLink="/items" routerLinkActive="active">
          I miei oggetti
        </a>
      </li>

      <li *ngIf="authService.isLoggedIn()" class="nav-item">
        <a routerLink="/offers" routerLinkActive="active">
          Offerte
        </a>
      </li>

      <li *ngIf="authService.isLoggedIn()" class="nav-item">
        <a routerLink="/exchanges" routerLinkActive="active">
          Scambi
        </a>
      </li>

      <li *ngIf="authService.isLoggedIn()" class="nav-item">
        <a routerLink="/messages" routerLinkActive="active">
          Messaggi
          <span *ngIf="notificationService.unreadThreadCount() as count" class="notification-badge">{{ count }}</span>
        </a>
      </li>

      <li *ngIf="authService.isLoggedIn()" class="nav-item">
        <a routerLink="/reviews" routerLinkActive="active">
          Recensioni
        </a>
      </li>

      <!-- Admin Links -->
      <li *ngIf="authService.hasRole('ADMIN')" class="nav-item admin">
        <a routerLink="/admin/reports" routerLinkActive="active">
          Segnalazioni
        </a>
      </li>

      <li *ngIf="authService.hasRole('ADMIN')" class="nav-item admin">
        <a routerLink="/admin/categories" routerLinkActive="active">
          Categorie
        </a>
      </li>

      <!-- Auth Links -->
      <li *ngIf="!authService.isLoggedIn()" class="nav-item">
        <a routerLink="/login" class="btn-login">
          Accedi
        </a>
      </li>

      <li *ngIf="!authService.isLoggedIn()" class="nav-item">
        <a routerLink="/register" class="btn-register">
          Registrati
        </a>
      </li>

      <!-- User Menu -->
      <li *ngIf="authService.isLoggedIn()" class="nav-item dropdown">
        <button class="dropdown-toggle" (click)="toggleDropdown()">
          {{ authService.getUsername() || 'Profilo' }}
          <span class="caret">▼</span>
        </button>
        <ul class="dropdown-menu" [class.active]="dropdownOpen()">
          <li>
            <a routerLink="/profile">Vedi profilo</a>
          </li>
          <li>
            <a routerLink="/reports/mine">Le mie segnalazioni</a>
          </li>
          <li class="divider"></li>
          <li>
            <a (click)="logout()" class="logout-link">Esci</a>
          </li>
        </ul>
      </li>
    </ul>

    <div class="hamburger" [class.active]="menuOpen()" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
